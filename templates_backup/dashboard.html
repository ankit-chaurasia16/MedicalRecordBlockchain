<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Patient | MedicalChain</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <div class="brand">MedicalChain</div>
    <div class="navlinks">
        <a href="/">Dashboard</a>
        <a href="/patients/add">Add Patient</a>
        <a href="/records/add">Add Record</a>
        <a href="/records">Records</a>
    </div>
</nav>
<main class="container narrow">
    <h1>Register New Patient</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="form-card">
        <label>Patient Name *</label>
        <input type="text" name="name" required>

        <label>Age</label>
        <input type="number" name="age" min="0" max="130">

        <label>Gender</label>
        <select name="gender">
            <option value="">Select gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Phone Number</label>
        <input type="text" name="phone">

        <button type="submit" class="btn">Register Patient</button>
    </form>
</main>
</body>
</html>
