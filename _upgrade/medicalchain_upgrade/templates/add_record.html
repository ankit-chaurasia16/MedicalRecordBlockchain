{% extends "base.html" %}{% block title %}Add Medical Record{% endblock %}{% block content %}
<div class="card" style="max-width:700px;margin:auto"><h1>Create Medical Record</h1><form method="post"><label>Assigned patient</label><select name="patient_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{ p.patient_id }}">{{ p.name }} (ID {{ p.patient_id }})</option>{% endfor %}</select><label>Diagnosis</label><input name="diagnosis" required><label>Prescription / Treatment</label><textarea name="prescription"></textarea><p><button type="submit">Save and Secure on Blockchain</button></p></form></div>{% endblock %}
