{% extends "base.html" %}{% block title %}Register Patient{% endblock %}{% block content %}
<div class="card" style="max-width:720px;margin:auto"><h1>Register a Patient</h1><p class="muted">The system assigns the patient to the least-loaded doctor in the selected department.</p>
<form method="post"><div class="grid"><div><label>Name</label><input name="name" required></div><div><label>Email</label><input type="email" name="email" required></div><div><label>Password</label><input type="password" name="password" minlength="8" required></div><div><label>Age</label><input type="number" name="age" min="0" max="130"></div><div><label>Gender</label><input name="gender"></div><div><label>Phone</label><input name="phone"></div><div><label>Disease category</label><select name="disease_category" required>{% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div></div><p><button type="submit">Create Patient Account</button></p></form></div>{% endblock %}
